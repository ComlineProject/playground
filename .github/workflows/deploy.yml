name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        run: rustup update stable && rustup default stable && rustup target add wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            wasm/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('wasm/Cargo.toml', 'app/package-lock.json') }}

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build editor WASM
        run: wasm-pack build wasm --release --target web --out-dir ../app/src/wasm --out-name comline_playground_wasm

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # `npm install` pulls `comline-simulator` (the sim engine) as a git
      # dependency and builds its WASM in `prepare` — lean `pkg/` + scripted
      # `pkg-script/`. The runner has cargo + wasm-opt; the cargo cache above
      # keeps the one-time wasm-bindgen-cli build.
      - name: Install
        working-directory: app
        run: npm install

      - name: Test (simulate view)
        working-directory: app
        run: npm test

      - name: Build site
        working-directory: app
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
