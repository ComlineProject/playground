[package]
name = "comline-playground-wasm"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# The same crates the CLI and the language server compose — by git rev, so the
# playground runs *that* code, not a re-implementation. Keep the `comline-core`
# rev identical across all of them (one `comline-core` in the tree).
comline-core = { git = "https://github.com/ComlineProject/core", rev = "2ae998634bad418e4a03ce7494e673275dafcc01" }
comline-codegen = { git = "https://github.com/ComlineProject/generation", rev = "de7ceb4c266d1fb5d6dc3c918d84cb226003f6b6" }
comline-codegen-rust = { git = "https://github.com/ComlineProject/comline-rust", rev = "5346678b82fc275fca741bf5ca0cfad1e8edf075" }
comline-codegen-typescript = { git = "https://github.com/ComlineProject/comline-typescript", rev = "c2096cd500f7cd3a83d495fbbbf5df72bc12ecc7" }
# The LSP's analysis layer (diagnostics / hover / completion / semantic tokens),
# without its `tower-lsp` server — builds for wasm32.
comline-language-server = { git = "https://github.com/ComlineProject/language-server", rev = "fe08374f45908b5d4d3796cb40a03b2dc221a6c2", default-features = false }
lsp-types = "0.94"
rust-sitter = "0.4.5" # parse-error types

wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"

[dev-dependencies]
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
