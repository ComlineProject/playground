[package]
name = "comline-playground-wasm"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# The same crates the CLI and the language server compose — by git rev, so the
# playground runs *that* code, not a re-implementation. Keep the `comline-core`
# rev identical across all of them (one `comline-core` in the tree).
comline-core = { git = "https://github.com/ComlineProject/core", rev = "cfddba1e01923cd556679a89d9570aa26339bec0" }
comline-codegen = { git = "https://github.com/ComlineProject/generation", rev = "7ac76d6786be07a8641dd395efd18f9db7af9fb1" }
comline-codegen-rust = { git = "https://github.com/ComlineProject/comline-rust", rev = "be03c84907ca1b11e2193688b12d7edfc30bad40" }
comline-codegen-typescript = { git = "https://github.com/ComlineProject/comline-typescript", rev = "13e68375968123929789c959d694d0aba58a9548" }
# The LSP's analysis layer (diagnostics / hover / completion / semantic tokens),
# without its `tower-lsp` server — builds for wasm32.
comline-language-server = { git = "https://github.com/ComlineProject/language-server", rev = "b88a7c9b77ffb478e476fc60f532320686599f37", default-features = false }
lsp-types = "0.94"
rust-sitter = "0.4.5" # parse-error types

wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"

[profile.release]
opt-level = "s"
lto = true
