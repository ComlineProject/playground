[package]
name = "comline-playground-wasm"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# The same crates the CLI and the language server compose — by git rev, so the
# playground runs *that* code, not a re-implementation. Keep the `comline-core`
# rev identical across all of them (one `comline-core` in the tree).
comline-core = { git = "https://github.com/ComlineProject/core", rev = "f6e289aaa137258e9e96c378c32d057c249a5b5d" }
comline-codegen = { git = "https://github.com/ComlineProject/generation", rev = "6e96a143393bb7f493dbfd2d8629e465d55d0d26" }
comline-codegen-rust = { git = "https://github.com/ComlineProject/comline-rust", rev = "eb9aabbc4f3a7fd9ce496592c183a644aa8ae631" }
comline-codegen-typescript = { git = "https://github.com/ComlineProject/comline-typescript", rev = "76b58cdde145cd1e79ccb9187df1ee524b2ee492" }
# The LSP's analysis layer (diagnostics / hover / completion / semantic tokens),
# without its `tower-lsp` server — builds for wasm32.
comline-language-server = { git = "https://github.com/ComlineProject/language-server", rev = "89c117ec7e7dd0241bd7cea5ff2a9dac901724c4", default-features = false }
lsp-types = "0.94"
rust-sitter = "0.4.5" # parse-error types

wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"

[dev-dependencies]
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
