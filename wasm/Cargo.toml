[package]
name = "comline-playground-wasm"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# The same crates the CLI and the language server compose — by git rev, so the
# playground runs *that* code, not a re-implementation. Keep the `comline-core`
# rev identical across all of them (one `comline-core` in the tree).
comline-core = { git = "https://github.com/ComlineProject/core", rev = "c01b756ae3183cb88fec5c4b7fb0d4bd34f1d66a" }
comline-codegen = { git = "https://github.com/ComlineProject/generation", rev = "caa22a31ffb21ea9e888a9c52c69781965abb00a" }
comline-codegen-rust = { git = "https://github.com/ComlineProject/comline-rust", rev = "a7bb69b87d549b1938e9aacecc80dd3e1ee04caa" }
comline-codegen-typescript = { git = "https://github.com/ComlineProject/comline-typescript", rev = "b96f2cac4d90a7dd81818c73d71e2832c694dd78" }
# The LSP's analysis layer (diagnostics / hover / completion / semantic tokens),
# without its `tower-lsp` server — builds for wasm32.
comline-language-server = { git = "https://github.com/ComlineProject/language-server", rev = "8159237bc5a39acc9387a7abe808a08682df0508", default-features = false }
lsp-types = "0.94"
rust-sitter = "0.4.5" # parse-error types

wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"

[profile.release]
opt-level = "s"
lto = true
