<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Comline Playground</title>
    <link rel="icon" type="image/svg+xml" href="/src/assets/brand/favicon.svg" />
    <link rel="icon" type="image/png" sizes="256x256" href="/src/assets/brand/favicon.png" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header>
      <div class="brand">
        <img
          class="brand-mark"
          src="/src/assets/brand/mark-cream.svg"
          alt=""
          aria-hidden="true"
        />
        <h1>Comline Playground</h1>
      </div>
      <div class="seg" id="app-mode" role="tablist" aria-label="workspace">
        <button data-app="edit" class="active">edit</button>
        <button data-app="simulate">simulate</button>
      </div>
      <select id="examples" aria-label="load an example schema">
        <option value="">Examples…</option>
      </select>
      <div class="controls" id="gen-controls">
        <div class="seg" id="mode" role="tablist" aria-label="generation mode">
          <button data-mode="code" class="active">code</button>
          <button data-mode="lib">lib</button>
        </div>
        <select id="target" aria-label="target language">
          <option value="rust">rust</option>
          <option value="typescript">typescript</option>
        </select>
      </div>
      <span id="status" class="status">loading…</span>
    </header>

    <main>
      <section class="pane">
        <div class="tabbar" id="tabbar"></div>
        <div id="editor"></div>
        <div id="editor-empty" class="empty is-hidden">
          no file open — open one from the tree below
        </div>
        <div class="tree-panel">
          <div class="tree-head">
            <button class="tree-toggle" id="files-toggle" aria-expanded="true">
              <span class="tree-caret">▾</span><span>schemas</span>
            </button>
            <button class="icon-btn" id="tree-add" title="new schema file">+</button>
          </div>
          <div class="filetree" id="tree"></div>
        </div>
        <div class="tree-panel problems-panel">
          <div class="tree-head">
            <button class="tree-toggle" id="problems-toggle" aria-expanded="true">
              <span class="tree-caret">▾</span><span>problems</span>
            </button>
            <span class="path" id="problems-count"></span>
          </div>
          <div class="problems-body" id="problems"></div>
        </div>
      </section>

      <section class="pane">
        <div class="pane-head">
          <div class="tabs" id="tabs">
            <button data-view="ir" class="active">IR</button>
            <button data-view="output">generated</button>
          </div>
        </div>
        <div id="view" class="view"></div>
      </section>
    </main>

    <div id="sim"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
